name: Update alpine press
on:
  schedule:
    - cron: '0 5,6,10,11,15,16 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/press.yml'
      - 'scripts/update_press.py'
permissions:
  contents: write
  pages: write
concurrency:
  group: alpine-press
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check Paris collection time
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import datetime, os
          from zoneinfo import ZoneInfo
          hour = datetime.datetime.now(ZoneInfo("Europe/Paris")).hour
          due = os.environ["EVENT_NAME"] != "schedule" or hour in (7, 12, 17)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("due=" + str(due).lower() + "\n")
          PY
      - uses: actions/checkout@v4
        if: steps.slot.outputs.due == 'true'
      - uses: actions/setup-python@v5
        if: steps.slot.outputs.due == 'true'
        with:
          python-version: '3.12'
      - run: python scripts/update_press.py
        if: steps.slot.outputs.due == 'true'
      - name: Save and publish new articles
        if: steps.slot.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- assets/press-articles.json presse/index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/press-articles.json presse/index.html
          git commit -m "Refresh alpine press selection"
          git pull --rebase origin main
          git push origin HEAD:main
          gh api --method POST repos/${{ github.repository }}/pages/builds

name: Update alpine press
on:
  schedule:
    - cron: '35 5 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/press.yml'
      - 'scripts/update_press.py'
permissions:
  contents: write
  pages: write
concurrency:
  group: alpine-press
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_press.py
      - name: Save and publish new articles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- assets/press-articles.json presse/index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/press-articles.json presse/index.html
          git commit -m "Refresh alpine press selection"
          git pull --rebase origin main
          git push origin HEAD:main
          gh api --method POST repos/${{ github.repository }}/pages/builds

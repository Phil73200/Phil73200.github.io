const $=id=>document.getElementById(id);let cols=[],data=[],shown=100,displayCols=[],dateIdx=-1,placeIdx=-1;const norm=s=>String(s??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();function idx(rx){return cols.findIndex(c=>rx.test(norm(c)))}function val(c){if(!c)return"";let v=c.f??c.v??"";let m=String(v).match(/^Date\((\d+),(\d+),(\d+)/);return m?m[3].padStart(2,"0")+"/"+String(+m[2]+1).padStart(2,"0")+"/"+m[1]:String(v)}function populate(id,i){if(i<0){$(id).parentElement.hidden=true;return}for(const v of [...new Set(data.map(r=>r[i]).filter(Boolean))].sort()){const o=document.createElement("option");o.value=v;o.textContent=v;$(id).append(o)}}function render(){const d=idx(/discipline|^disc$|^event$/),n=idx(/nation|^nat$|pays|country/),q=norm($("search").value);const filtered=data.filter(r=>(!$("disc").value||r[d]===$("disc").value)&&(!$("nation").value||r[n]===$("nation").value)&&(!q||norm(r.join(" ")).includes(q)));$("status").textContent=filtered.length+" lignes";const frag=document.createDocumentFragment();for(const r of filtered.slice(0,shown)){const tr=document.createElement("tr");for(const i of displayCols){const td=document.createElement("td");const column=norm(cols[i]).trim().replace(/[^a-z0-9]/g,"");const value=norm(r[i]).trim();if(/^(g|gender|sex|sexe)$/.test(column)&&["m","w"].includes(value))td.classList.add("sex-"+value);if(i===d&&["sl","gs","sg","dh"].includes(value))td.classList.add("disc-"+value);if(/^(calcpena|applipena|apply\d*|racepts|points)$/.test(column))td.classList.add("points-red");td.textContent=r[i];tr.append(td)}frag.append(tr)}$("rows").replaceChildren(frag);$("more").hidden=filtered.length<=shown}
window.receivePenalties=function(resp){if(!resp.table){$("status").textContent="Lecture impossible : vérifier le partage public du Google Sheet.";return}cols=(resp.table.cols||[]).map((c,i)=>c.label||c.id||"Colonne "+(i+1));data=(resp.table.rows||[]).map(r=>cols.map((_,i)=>val((r.c||[])[i]))).filter(r=>r.some(Boolean));dateIdx=idx(/^date$|date.*course|race.*date|^jour$|^datum$/);placeIdx=idx(/^place$|^lieu$|station|localit|resort|^site$|^ville$|race.*place|location/);displayCols=placeIdx>=0?[placeIdx,...cols.map((_,i)=>i).filter(i=>i!==placeIdx)]:cols.map((_,i)=>i);const tr=document.createElement("tr");for(const i of displayCols){const th=document.createElement("th");th.textContent=cols[i];tr.append(th)}$("head").replaceChildren(tr);populate("disc",idx(/discipline|^disc$|^event$/));populate("nation",idx(/nation|^nat$|pays|country/));render()};for(const id of ["disc","nation","search"])$(id).addEventListener("input",()=>{shown=100;render()});$("more").onclick=()=>{shown+=100;render()};const script=document.createElement("script");script.src="https://docs.google.com/spreadsheets/d/1-l9I_B30cIlggOOtJE4WSQu36W66BgKn5HX629ABz-g/gviz/tq?gid=403608582&headers=1&tqx="+encodeURIComponent("out:json;responseHandler:receivePenalties");script.onerror=()=>{$("status").textContent="Impossible de charger la feuille Google."};document.head.append(script);
